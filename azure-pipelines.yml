trigger:
  branches:
    include:
      - feature/*
      - develop

pr:
  branches:
    include:
      - feature/*
      - develop

variables:
- group: mainframe-devops

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x'
  displayName: Use Python for SQL validation

- script: python scripts/validate_sql.py
  displayName: Validate all DB2 SQL files

- script: |
    set -euo pipefail
    mkdir -p "$(Build.ArtifactStagingDirectory)/prepared"
    while IFS= read -r -d '' sql_file; do
      output_file="$(Build.ArtifactStagingDirectory)/prepared/$(basename "$sql_file")"
      python scripts/prepare_fb80.py "$sql_file" "$output_file"
    done < <(find . -path './.git' -prune -o -type f -name '*.sql' -print0)
  displayName: Prepare SQL files as EBCDIC FB80

- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: Use Node.js for Zowe CLI

- script: |
    set -euo pipefail
    npm install --global @zowe/cli
    mkdir -p "$(Build.ArtifactStagingDirectory)/version"
    python scripts/create_zowe_config.py application.json "$(Build.ArtifactStagingDirectory)/zowe.config.json"
    export ZOWE_CLI_HOME="$(Build.ArtifactStagingDirectory)/zowe-home"
    mkdir -p "$ZOWE_CLI_HOME"
    cp "$(Build.ArtifactStagingDirectory)/zowe.config.json" "$ZOWE_CLI_HOME/zowe.config.json"
    python scripts/create_version_query.py application.json "$(Build.ArtifactStagingDirectory)/version/version-check.sql"
    version_query_path=$(python -c 'import json; print(json.load(open("application.json"))["versionCheck"]["ussPath"])')
    zowe zos-files upload dir-to-uss "$(Build.ArtifactStagingDirectory)/version" "$(dirname "$version_query_path")" --encoding "IBM-1047"
    sed "s|__VERSION_QUERY_PATH__|$version_query_path|g" jcl/version-check.jcl > "$(Build.ArtifactStagingDirectory)/version/version-check-run.jcl"
    zowe zos-jobs submit local-file "$(Build.ArtifactStagingDirectory)/version/version-check-run.jcl" --wfo true --rfj > "$(Build.ArtifactStagingDirectory)/version/version-output.json"
    python scripts/parse_sysprint.py "$(Build.ArtifactStagingDirectory)/version/version-output.json" > "$(Build.ArtifactStagingDirectory)/version/current-version.txt"
    echo "Version returned by SYSOUT: $(cat "$(Build.ArtifactStagingDirectory)/version/current-version.txt")"
  displayName: Run version check JCL and parse SYSOUT
  env:
    MAINFRAME_PASSWORD: $(MAINFRAME_PASSWORD)

- script: |
    set -euo pipefail
    npm install --global @zowe/cli
    python scripts/create_zowe_config.py application.json "$(Build.ArtifactStagingDirectory)/zowe.config.json"
    export ZOWE_CLI_HOME="$(Build.ArtifactStagingDirectory)/zowe-home"
    mkdir -p "$ZOWE_CLI_HOME"
    cp "$(Build.ArtifactStagingDirectory)/zowe.config.json" "$ZOWE_CLI_HOME/zowe.config.json"
    zowe zos-files upload dir-to-uss "$(Build.ArtifactStagingDirectory)/prepared" "/z/z80145" --encoding "IBM-1047"
  displayName: Upload SQL files to USS with Zowe
  env:
    MAINFRAME_PASSWORD: $(MAINFRAME_PASSWORD)

- script: |
    echo "Azure DevOps pipeline triggered successfully"
    echo "Branch: $(Build.SourceBranch)"
    echo "Commit: $(Build.SourceVersion)"
  displayName: Verify GitHub trigger
