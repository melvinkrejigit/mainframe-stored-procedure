# This pipeline is intentionally manual and independent of ci-pipeline.yml/cd-pipeline.yml.
trigger: none
pr: none

parameters:
- name: rollbackNeeded
  displayName: Rollback needed?
  type: string
  default: No
  values:
    - Yes
    - No
- name: buildId
  displayName: Build ID of the previously deployed CD run to roll back
  type: string
  default: ''
- name: component
  displayName: Stored procedure component to roll back
  type: string
  default: current-timestamp
  values:
    - current-timestamp

variables:
- group: mainframe-devops
- group: ado-automation

stages:
- stage: Rollback
  displayName: Rollback operation
  condition: eq('${{ parameters.rollbackNeeded }}', 'Yes')
  jobs:
  - job: SubmitRollbackDateCheck
    pool:
      name: SelfHosted-Mainframe
    steps:
    - checkout: self
    - script: |
        set -euo pipefail
        build_id="${{ parameters.buildId }}"
        if [ -z "$build_id" ]; then
          echo "##vso[task.logissue type=error]No buildId parameter provided. Re-run the pipeline and enter the CD build ID being rolled back."
          exit 1
        fi
        echo "Looking up build $build_id in Azure DevOps to confirm it exists..."
        response=$(curl -s -u ":$(ADO_PAT)" "https://dev.azure.com/melvinrejiuk01/MF%20DevOps%20Project/_apis/build/builds/$build_id?api-version=7.1")
        build_status=$(python -c "import json,sys; d=json.loads(sys.argv[1]); print(d.get('status','unknown'))" "$response")
        build_result=$(python -c "import json,sys; d=json.loads(sys.argv[1]); print(d.get('result','unknown'))" "$response")
        build_def=$(python -c "import json,sys; d=json.loads(sys.argv[1]); print(d.get('definition',{}).get('name','unknown'))" "$response")
        if [ "$build_status" = "unknown" ] && [ "$build_result" = "unknown" ]; then
          echo "##vso[task.logissue type=error]Build $build_id was not found in project 'MF DevOps Project'."
          exit 1
        fi
        echo "Build $build_id: pipeline='$build_def' status='$build_status' result='$build_result'"
        echo "Rolling back component: ${{ parameters.component }}"
      displayName: Verify build ID and selected component
    - script: |
        set -euo pipefail
        app_file="$(Build.SourcesDirectory)/config/application.json"
        test -f "$app_file" || { echo "application.json not found at $app_file on $(Build.SourceBranch)"; exit 1; }
        python "$(Build.SourcesDirectory)/pipelines/scripts/create_zowe_config.py" "$app_file" "$(Build.ArtifactStagingDirectory)/zowe.config.json"
        export ZOWE_CLI_HOME="$(Build.ArtifactStagingDirectory)/zowe-home"
        mkdir -p "$ZOWE_CLI_HOME"
        cp "$(Build.ArtifactStagingDirectory)/zowe.config.json" "$ZOWE_CLI_HOME/zowe.config.json"
        manifest="$(Build.SourcesDirectory)/config/components.json"
        uss_path=$(python "$(Build.SourcesDirectory)/pipelines/scripts/lookup_component_uss_path.py" "$manifest" "${{ parameters.component }}" "${{ parameters.buildId }}")
        echo "+ zowe zos-files view uss-file $uss_path"
        zowe zos-files view uss-file "$uss_path" 2>&1 | tee "$(Build.ArtifactStagingDirectory)/uss-component-content.txt"
      displayName: 'Display ${{ parameters.component }} content from USS for build ${{ parameters.buildId }}'
      timeoutInMinutes: 10
      env:
        MAINFRAME_PASSWORD: $(MAINFRAME_PASSWORD)
    - script: |
        set -euo pipefail
        app_file="$(Build.SourcesDirectory)/config/application.json"
        test -f "$app_file" || { echo "application.json not found at $app_file on $(Build.SourceBranch)"; exit 1; }
        echo "Using application config: $app_file"
        mkdir -p "$(Build.ArtifactStagingDirectory)/rollback"
        python "$(Build.SourcesDirectory)/pipelines/scripts/create_zowe_config.py" "$app_file" "$(Build.ArtifactStagingDirectory)/zowe.config.json"
        export ZOWE_CLI_HOME="$(Build.ArtifactStagingDirectory)/zowe-home"
        mkdir -p "$ZOWE_CLI_HOME"
        cp "$(Build.ArtifactStagingDirectory)/zowe.config.json" "$ZOWE_CLI_HOME/zowe.config.json"
        rollback_template=$(python -c 'import json, os; app=os.environ["APP_FILE"]; repo_root=os.environ["BUILD_SOURCESDIRECTORY"]; print(os.path.join(repo_root, json.load(open(app))["rollback"]["jclTemplate"]))')
        python "$(Build.SourcesDirectory)/pipelines/scripts/render_version_jcl.py" "$app_file" "$rollback_template" "$(Build.ArtifactStagingDirectory)/rollback/rollback-date-run.jcl" query rollback
        echo "+ zowe zos-jobs submit local-file rollback-date-run.jcl --wfo true --rfj"
        zowe zos-jobs submit local-file "$(Build.ArtifactStagingDirectory)/rollback/rollback-date-run.jcl" --wfo true --rfj 2>&1 | tee "$(Build.ArtifactStagingDirectory)/rollback/submit-response.json"
        echo "+ python pipelines/scripts/extract_job_id.py submit-response.json"
        job_id=$(python "$(Build.SourcesDirectory)/pipelines/scripts/extract_job_id.py" "$(Build.ArtifactStagingDirectory)/rollback/submit-response.json")
        echo "Rollback job ID: $job_id"
        echo "+ zowe zos-jobs view job-status-by-jobid $job_id --rfj"
        zowe zos-jobs view job-status-by-jobid "$job_id" --rfj 2>&1 | tee "$(Build.ArtifactStagingDirectory)/rollback/job-status.json"
        echo "+ zowe zos-jobs view all-spool-content $job_id --rfj"
        zowe zos-jobs view all-spool-content "$job_id" --rfj 2>&1 | tee "$(Build.ArtifactStagingDirectory)/rollback/job-log.json"
        echo "+ python pipelines/scripts/parse_sysprint_value.py job-log.json"
        rollback_date=$(python "$(Build.SourcesDirectory)/pipelines/scripts/parse_sysprint_value.py" "$(Build.ArtifactStagingDirectory)/rollback/job-log.json")
        echo "Rollback test date returned by SYSPRINT: $rollback_date"
      displayName: 'Submit rollback JCL for ${{ parameters.component }} and read SYSPRINT'
      timeoutInMinutes: 10
      env:
        MAINFRAME_PASSWORD: $(MAINFRAME_PASSWORD)
        APP_FILE: $(Build.SourcesDirectory)/config/application.json

- stage: RollbackNotRequested
  displayName: Rollback not requested
  condition: eq('${{ parameters.rollbackNeeded }}', 'No')
  jobs:
  - job: NoRollback
    pool:
      name: SelfHosted-Mainframe
    steps:
    - script: echo "Rollback not requested; no mainframe operation was submitted."
      displayName: Skip rollback
