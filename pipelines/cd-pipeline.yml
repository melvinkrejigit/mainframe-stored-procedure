# CD: queued automatically by a fire-and-forget REST API call at the end of
# ci-pipeline.yml's Validate stage (avoids the resource-trigger limitation
# that only reads trigger definitions from the repo's default branch).
trigger: none
pr: none

variables:
- group: mainframe-devops
- name: artifactsFeed
  value: MF DevOps Project/mf-devops-sql
- name: preparedSqlPackage
  value: prepared-sql

stages:
- stage: Deploy
  displayName: Mainframe deployment
  jobs:
  - job: DeployToMainframe
    pool:
      name: SelfHosted-Mainframe
    steps:
    - checkout: self
    - task: UniversalPackages@0
      displayName: Download prepared SQL from Azure Artifacts
      inputs:
        command: download
        downloadDirectory: $(Pipeline.Workspace)/prepared-sql
        feedsToUse: internal
        vstsFeed: $(artifactsFeed)
        vstsFeedPackage: $(preparedSqlPackage)
        vstsPackageVersion: '*'
    - script: |
        set -euo pipefail
        mkdir -p "$(Build.ArtifactStagingDirectory)/version"
        python pipelines/scripts/create_zowe_config.py config/application.json "$(Build.ArtifactStagingDirectory)/zowe.config.json"
        export ZOWE_CLI_HOME="$(Build.ArtifactStagingDirectory)/zowe-home"
        mkdir -p "$ZOWE_CLI_HOME"
        cp "$(Build.ArtifactStagingDirectory)/zowe.config.json" "$ZOWE_CLI_HOME/zowe.config.json"
        python pipelines/scripts/render_version_jcl.py config/application.json pipelines/templates/version-check.jcl "$(Build.ArtifactStagingDirectory)/version/version-check-run.jcl"
        job_output_dir="$(Build.ArtifactStagingDirectory)/version/job-output"
        mkdir -p "$job_output_dir"
        echo "+ zowe zos-jobs submit local-file version-check-run.jcl --wfo true --rfj"
        zowe zos-jobs submit local-file "$(Build.ArtifactStagingDirectory)/version/version-check-run.jcl" --wfo true --rfj 2>&1 | tee "$(Build.ArtifactStagingDirectory)/version/submit-response.json"
        echo "+ python pipelines/scripts/extract_job_id.py submit-response.json"
        job_id=$(python pipelines/scripts/extract_job_id.py "$(Build.ArtifactStagingDirectory)/version/submit-response.json")
        echo "Submitted job ID: $job_id"
        echo "+ zowe zos-jobs view job-status-by-jobid $job_id --rfj"
        zowe zos-jobs view job-status-by-jobid "$job_id" --rfj 2>&1 | tee "$(Build.ArtifactStagingDirectory)/version/job-status.json"
        echo "+ zowe zos-jobs view all-spool-content $job_id --rfj"
        zowe zos-jobs view all-spool-content "$job_id" --rfj 2>&1 | tee "$(Build.ArtifactStagingDirectory)/version/job-log.json"
        echo "+ python pipelines/scripts/parse_sysprint.py job-log.json"
        python pipelines/scripts/parse_sysprint.py "$(Build.ArtifactStagingDirectory)/version/job-log.json" | tee "$(Build.ArtifactStagingDirectory)/version/current-version.txt"
        echo "Version returned by SYSPRINT: $(cat "$(Build.ArtifactStagingDirectory)/version/current-version.txt")"
      displayName: Run version check JCL and parse SYSPRINT
      timeoutInMinutes: 10
      env:
        MAINFRAME_PASSWORD: $(MAINFRAME_PASSWORD)
    - script: |
        set -euo pipefail
        python pipelines/scripts/create_zowe_config.py config/application.json "$(Build.ArtifactStagingDirectory)/zowe.config.json"
        export ZOWE_CLI_HOME="$(Build.ArtifactStagingDirectory)/zowe-home"
        mkdir -p "$ZOWE_CLI_HOME"
        cp "$(Build.ArtifactStagingDirectory)/zowe.config.json" "$ZOWE_CLI_HOME/zowe.config.json"
        uss_directory=$(python -c 'import json; print(json.load(open("config/application.json"))["sqlDeployment"]["ussDirectory"])')
        echo "+ zowe zos-files upload dir-to-uss $(Pipeline.Workspace)/prepared-sql $uss_directory --encoding IBM-1047"
        zowe zos-files upload dir-to-uss "$(Pipeline.Workspace)/prepared-sql" "$uss_directory" --encoding "IBM-1047" 2>&1 | tee "$(Build.ArtifactStagingDirectory)/upload-response.log"
      displayName: Upload SQL files to USS with Zowe
      timeoutInMinutes: 10
      env:
        MAINFRAME_PASSWORD: $(MAINFRAME_PASSWORD)
    - script: |
        set -euo pipefail
        python pipelines/scripts/create_zowe_config.py config/application.json "$(Build.ArtifactStagingDirectory)/zowe.config.json"
        export ZOWE_CLI_HOME="$(Build.ArtifactStagingDirectory)/zowe-home"
        mkdir -p "$ZOWE_CLI_HOME"
        cp "$(Build.ArtifactStagingDirectory)/zowe.config.json" "$ZOWE_CLI_HOME/zowe.config.json"
        sql_template=$(python -c 'import json; print(json.load(open("config/application.json"))["sqlDeployment"]["jclTemplate"])')
        uss_directory=$(python -c 'import json; print(json.load(open("config/application.json"))["sqlDeployment"]["ussDirectory"])')
        mkdir -p "$(Build.ArtifactStagingDirectory)/execute"
        while IFS= read -r -d '' prepared_file; do
          file_name=$(basename "$prepared_file")
          uss_path="$uss_directory/$file_name"
          run_jcl="$(Build.ArtifactStagingDirectory)/execute/$file_name.jcl"
          python pipelines/scripts/render_sql_jcl.py "$sql_template" "$uss_path" "$run_jcl"
          echo "+ zowe zos-jobs submit local-file $run_jcl --wfo true --vasc --rfj"
          zowe zos-jobs submit local-file "$run_jcl" --wfo true --vasc --rfj 2>&1 | tee "$(Build.ArtifactStagingDirectory)/execute/$file_name-response.json"
        done < <(find "$(Pipeline.Workspace)/prepared-sql" -type f -name '*.sql' -print0)
      displayName: Submit generic DSNTEP2 JCL for uploaded SQL
      timeoutInMinutes: 10
      env:
        MAINFRAME_PASSWORD: $(MAINFRAME_PASSWORD)
    - script: |
        echo "Azure DevOps CD pipeline triggered successfully"
        echo "Branch: $(Build.SourceBranch)"
        echo "Commit: $(Build.SourceVersion)"
      displayName: Verify GitHub trigger

- stage: AutomatedTest
  displayName: Automated DB2 version test
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - job: TestVersion
    pool:
      name: SelfHosted-Mainframe
    steps:
    - checkout: self
    - script: |
        set -euo pipefail
        mkdir -p "$(Build.ArtifactStagingDirectory)/test"
        python pipelines/scripts/create_zowe_config.py config/application.json "$(Build.ArtifactStagingDirectory)/zowe.config.json"
        export ZOWE_CLI_HOME="$(Build.ArtifactStagingDirectory)/zowe-home"
        mkdir -p "$ZOWE_CLI_HOME"
        cp "$(Build.ArtifactStagingDirectory)/zowe.config.json" "$ZOWE_CLI_HOME/zowe.config.json"
        test_template=$(python -c 'import json; print(json.load(open("config/application.json"))["versionCheck"]["testJclTemplate"])')
        python pipelines/scripts/render_version_jcl.py config/application.json "$test_template" "$(Build.ArtifactStagingDirectory)/test/test-version-run.jcl" testQuery
        echo "+ zowe zos-jobs submit local-file test-version-run.jcl --wfo true --rfj"
        zowe zos-jobs submit local-file "$(Build.ArtifactStagingDirectory)/test/test-version-run.jcl" --wfo true --rfj 2>&1 | tee "$(Build.ArtifactStagingDirectory)/test/submit-response.json"
        echo "+ python pipelines/scripts/extract_job_id.py submit-response.json"
        job_id=$(python pipelines/scripts/extract_job_id.py "$(Build.ArtifactStagingDirectory)/test/submit-response.json")
        echo "Automated test job ID: $job_id"
        echo "+ zowe zos-jobs view job-status-by-jobid $job_id --rfj"
        zowe zos-jobs view job-status-by-jobid "$job_id" --rfj 2>&1 | tee "$(Build.ArtifactStagingDirectory)/test/job-status.json"
        echo "+ zowe zos-jobs view all-spool-content $job_id --rfj"
        zowe zos-jobs view all-spool-content "$job_id" --rfj 2>&1 | tee "$(Build.ArtifactStagingDirectory)/test/job-log.json"
        echo "+ python pipelines/scripts/parse_sysprint.py job-log.json"
        actual_version=$(python pipelines/scripts/parse_sysprint.py "$(Build.ArtifactStagingDirectory)/test/job-log.json")
        expected_version=$(python -c 'import json; print(json.load(open("config/application.json"))["versionCheck"]["expectedTestVersion"])')
        echo "Automated test SYSPRINT version: $actual_version"
        if [ "$actual_version" != "$expected_version" ]; then
          echo "Expected $expected_version but received $actual_version"
          exit 1
        fi
        echo "Automated version test passed: $actual_version"
      displayName: Submit V2 test JCL and verify SYSPRINT
      timeoutInMinutes: 10
      env:
        MAINFRAME_PASSWORD: $(MAINFRAME_PASSWORD)
